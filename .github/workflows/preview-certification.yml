name: Preview Runtime Certification

on:
  push:
    branches:
      - agent/final-audit-hardening

permissions:
  contents: read

jobs:
  certify-preview:
    name: Health → Authenticated Core Flow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: https://ai-resume-builder-git-agent-final-cbabe8-akshat92008s-projects.vercel.app
      EXPECTED_COMMIT_SHA: b9328b45e487c3c9760b5543c74bbd2eab974e54

    steps:
      - uses: actions/checkout@v6
        with:
          ref: b9328b45e487c3c9760b5543c74bbd2eab974e54

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify preview commit and infrastructure readiness
        run: |
          node <<'NODE'
          (async () => {
            const base = process.env.E2E_BASE_URL.replace(/\/$/, "");
            const live = await fetch(`${base}/api/health/live`, { redirect: "error" });
            const livePayload = await live.json().catch(() => ({}));
            if (!live.ok) throw new Error(`Liveness failed: HTTP ${live.status}`);
            if (livePayload.commit !== process.env.EXPECTED_COMMIT_SHA) {
              throw new Error(`Liveness SHA mismatch: expected ${process.env.EXPECTED_COMMIT_SHA}, got ${livePayload.commit}`);
            }

            const response = await fetch(`${base}/api/health`, { redirect: "error" });
            const payload = await response.json().catch(() => ({}));
            if (payload.commit !== process.env.EXPECTED_COMMIT_SHA) {
              throw new Error(`Readiness SHA mismatch: expected ${process.env.EXPECTED_COMMIT_SHA}, got ${payload.commit}`);
            }
            if (
              !response.ok ||
              payload.status !== "ready" ||
              payload.checks?.coreConfiguration !== true ||
              payload.checks?.database !== true ||
              payload.checks?.redis !== true ||
              payload.checks?.observability !== true
            ) {
              console.error("Preview is not core-ready", { status: response.status, payload });
              process.exit(1);
            }
            console.log("Preview readiness verified", { commit: payload.commit });
          })().catch((error) => {
            console.error("Preview readiness probe failed", error);
            process.exit(1);
          });
          NODE

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run authenticated real-AI core flow
        env:
          CI: true
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
          E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
          REQUIRE_AUTH_E2E: "true"
          RUN_REAL_AI_E2E: "true"
        run: npx playwright test tests/e2e/smoke.spec.ts tests/e2e/core-flow.spec.ts

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: preview-certification-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
