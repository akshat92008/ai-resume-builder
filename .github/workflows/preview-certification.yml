name: Production Runtime Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose-production:
    name: Health → Authenticated Core Flow
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: https://ai-resume-builder-ivory-nine.vercel.app

    steps:
      - uses: actions/checkout@v6
        with:
          ref: b9328b45e487c3c9760b5543c74bbd2eab974e54

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect production liveness and readiness
        run: |
          node <<'NODE'
          (async () => {
            const base = process.env.E2E_BASE_URL.replace(/\/$/, "");
            const live = await fetch(`${base}/api/health/live`);
            const livePayload = await live.json().catch(() => ({}));
            console.log("LIVENESS", JSON.stringify({ status: live.status, payload: livePayload }));

            const response = await fetch(`${base}/api/health`);
            const payload = await response.json().catch(() => ({}));
            console.log("READINESS", JSON.stringify({ status: response.status, payload }));

            if (!live.ok) throw new Error(`Liveness failed: HTTP ${live.status}`);
            if (
              !response.ok ||
              payload.status !== "ready" ||
              payload.checks?.coreConfiguration !== true ||
              payload.checks?.database !== true ||
              payload.checks?.redis !== true ||
              payload.checks?.observability !== true
            ) {
              console.error("Production is not core-ready");
              process.exit(1);
            }
          })().catch((error) => {
            console.error("Production readiness probe failed", error);
            process.exit(1);
          });
          NODE

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run authenticated real-AI core flow
        env:
          CI: true
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
          E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
          REQUIRE_AUTH_E2E: "true"
          RUN_REAL_AI_E2E: "true"
        run: npx playwright test tests/e2e/smoke.spec.ts tests/e2e/core-flow.spec.ts

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-diagnostic-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
