name: Refresh dependency lockfile

on:
  push:
    branches:
      - agent/premium-ui-and-production-audit-fixes
    paths:
      - package.json
      - .github/workflows/refresh-lockfile.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/premium-ui-and-production-audit-fixes
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm install --package-lock-only --ignore-scripts
      - name: Commit regenerated lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Sync lockfile after removing Stripe dependencies"
          git push origin HEAD:agent/premium-ui-and-production-audit-fixes
