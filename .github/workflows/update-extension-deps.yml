name: Regenerate extension lockfile

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'agent/final-architecture-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/final-architecture-hardening

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Upgrade CRXJS and regenerate lockfile
        working-directory: extension
        run: npm install --save-dev @crxjs/vite-plugin@^2.7.1

      - name: Build extension with regenerated dependency graph
        working-directory: extension
        run: npm run build

      - name: Commit regenerated dependency files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/package.json extension/package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency files are already current"
          else
            git commit -m "Upgrade extension build dependencies"
            git push origin HEAD:agent/final-architecture-hardening
          fi
