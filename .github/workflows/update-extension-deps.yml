name: Regenerate extension lockfile

on:
  push:
    branches: [agent/final-architecture-hardening]
    paths: [.github/workflows/update-extension-deps.yml]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/final-architecture-hardening

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Upgrade CRXJS and regenerate lockfile
        working-directory: extension
        run: npm install --save-dev @crxjs/vite-plugin@^2.7.1

      - name: Build extension with regenerated dependency graph
        working-directory: extension
        run: npm run build

      - name: Commit regenerated lockfile and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extension/package.json extension/package-lock.json
          git rm .github/workflows/update-extension-deps.yml
          git commit -m "Upgrade extension build dependencies"
          git push origin HEAD:agent/final-architecture-hardening
