name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-migrations:
    name: Clean Supabase migration replay
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Postgres
        run: supabase db start

      - name: Replay every migration from zero
        run: supabase db reset --local --no-seed

      - name: Lint local database
        run: supabase db lint --local

      - name: Verify RLS security invariants
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

  ci:
    name: Audit → Lint → Typecheck → Test → Build → Browser Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run --reporter=verbose
        env:
          CI: true

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Install Chromium for browser smoke tests
        # GitHub's hosted Ubuntu image already carries Chromium's system libraries.
        # Avoid --with-deps here: it performs a full apt update and has proven flaky
        # across runner-image rotations even when every required library is present.
        run: npx playwright install chromium

      - name: Browser smoke tests
        run: npm run test:e2e:smoke
        env:
          CI: true
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Audit extension dependencies
        working-directory: extension
        run: npm audit --audit-level=high

      - name: Build Chrome extension beta
        working-directory: extension
        run: npm run build

      - name: Verify extension package output
        run: test -f extension/dist/manifest.json
