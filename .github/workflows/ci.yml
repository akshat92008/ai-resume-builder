name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Audit → Lint → Typecheck → Test → Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # Temporary remediation step for this audit branch. The generated lockfile is
      # uploaded and will be committed, then this step will be removed so main stays
      # deterministic under npm ci.
      - name: Generate security-patched lockfile
        run: npm audit fix --package-lock-only

      - name: Upload remediated lockfile
        uses: actions/upload-artifact@v7
        with:
          name: remediated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Install dependencies from remediated lockfile
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run --reporter=verbose
        env:
          CI: true

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Build Chrome extension beta
        working-directory: extension
        run: npm run build

      - name: Verify extension package output
        run: test -f extension/dist/manifest.json
