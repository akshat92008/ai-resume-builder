name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Audit → Lint → Typecheck → Test → Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      # One-time audit-branch remediation. This generated lock is committed below;
      # the final main workflow removes this mutation and returns to read-only CI.
      - name: Generate security-patched lockfile
        run: npm audit fix --package-lock-only

      - name: Install dependencies from remediated lockfile
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Commit remediated lockfile to audit branch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/production-audit'
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already clean"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: remediate production dependency vulnerabilities"
          git push origin HEAD:${{ github.head_ref }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --run --reporter=verbose
        env:
          CI: true

      - name: Production build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Install extension dependencies
        working-directory: extension
        run: npm ci

      - name: Build Chrome extension beta
        working-directory: extension
        run: npm run build

      - name: Verify extension package output
        run: test -f extension/dist/manifest.json
