name: Core Commercial Release Gate

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "HTTPS deployment URL to certify"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: core-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-core:
    name: Health → Security → Authenticated Core Flow
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate deployment URL
        env:
          E2E_BASE_URL: ${{ inputs.deployment_url }}
        run: |
          node -e 'const u=new URL(process.env.E2E_BASE_URL); if(u.protocol!=="https:") { console.error("deployment_url must use HTTPS"); process.exit(1); }'

      - name: Install dependencies
        run: npm ci

      - name: Verify deployed core readiness
        env:
          E2E_BASE_URL: ${{ inputs.deployment_url }}
        run: |
          node <<'NODE'
          const base = process.env.E2E_BASE_URL.replace(/\/$/, "");
          const response = await fetch(`${base}/api/health`, { redirect: "error" });
          const payload = await response.json().catch(() => ({}));
          if (!response.ok || payload.status !== "ready" || payload.checks?.coreConfiguration !== true || payload.checks?.observability !== true) {
            console.error("Core deployment is not ready", { status: response.status, payload });
            process.exit(1);
          }
          console.log("Core readiness verified", { commit: payload.commit, billing: payload.checks?.billing });
          NODE

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run public security smoke and authenticated core flow
        env:
          CI: true
          E2E_BASE_URL: ${{ inputs.deployment_url }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          REQUIRE_AUTH_E2E: "true"
        run: npx playwright test tests/e2e/smoke.spec.ts tests/e2e/core-flow.spec.ts

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-release-playwright-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
