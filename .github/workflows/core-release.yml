name: Core Commercial Release Gate

on:
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "HTTPS deployment URL to certify"
        required: true
        default: "https://ai-resume-builder-ivory-nine.vercel.app"
        type: string

permissions:
  contents: read

concurrency:
  group: core-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-core:
    name: Health → Security → Authenticated Core Flow
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate deployment URL
        env:
          E2E_BASE_URL: ${{ inputs.deployment_url }}
        run: |
          node -e 'const u=new URL(process.env.E2E_BASE_URL); if(u.protocol!=="https:") { console.error("deployment_url must use HTTPS"); process.exit(1); }'

      - name: Install dependencies
        run: npm ci

      - name: Verify deployed commit and infrastructure readiness
        env:
          E2E_BASE_URL: ${{ inputs.deployment_url }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          (async () => {
            const base = process.env.E2E_BASE_URL.replace(/\/$/, "");
            const expected = process.env.EXPECTED_COMMIT_SHA;

            const live = await fetch(`${base}/api/health/live`, { redirect: "error" });
            const livePayload = await live.json().catch(() => ({}));
            if (!live.ok) throw new Error(`Liveness failed: HTTP ${live.status}`);
            if (livePayload.commit !== expected) {
              console.error("Liveness SHA mismatch", { expected, deployed: livePayload.commit });
              process.exit(1);
            }

            const response = await fetch(`${base}/api/health`, { redirect: "error" });
            const payload = await response.json().catch(() => ({}));
            if (payload.commit !== expected) {
              console.error("Readiness SHA mismatch", { expected, deployed: payload.commit });
              process.exit(1);
            }

            const backend = payload.checks?.observabilityBackend;
            if (
              !response.ok ||
              payload.status !== "ready" ||
              payload.checks?.coreConfiguration !== true ||
              payload.checks?.database !== true ||
              payload.checks?.redis !== true ||
              payload.checks?.observability !== true ||
              !["sentry", "vercel-runtime"].includes(backend)
            ) {
              console.error("Core deployment is not ready", { status: response.status, payload });
              process.exit(1);
            }
            console.log("Core readiness verified", { commit: payload.commit, observabilityBackend: backend });
          })().catch((error) => {
            console.error("Core readiness probe failed", error);
            process.exit(1);
          });
          NODE

      - name: Verify compromised-password rejection
        env:
          E2E_BASE_URL: ${{ inputs.deployment_url }}
        run: |
          node <<'NODE'
          (async () => {
            const base = process.env.E2E_BASE_URL.replace(/\/$/, "");
            const response = await fetch(`${base}/api/auth/signup`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                email: `release-probe-${Date.now()}@example.com`,
                password: "password",
              }),
            });
            const payload = await response.json().catch(() => ({}));
            if (response.status !== 400 || payload.error?.code !== "COMPROMISED_PASSWORD") {
              console.error("Compromised-password protection failed", { status: response.status, code: payload.error?.code });
              process.exit(1);
            }
            console.log("Compromised-password protection verified");
          })().catch((error) => {
            console.error("Password-safety probe failed", error);
            process.exit(1);
          });
          NODE

      - name: Verify first-party browser telemetry endpoint
        env:
          E2E_BASE_URL: ${{ inputs.deployment_url }}
        run: |
          node <<'NODE'
          (async () => {
            const base = process.env.E2E_BASE_URL.replace(/\/$/, "");
            const response = await fetch(`${base}/api/observability/client-error`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                source: "window-error",
                errorName: "ReleaseProbeError",
                fingerprint: "a".repeat(64),
                route: "/release-probe",
                digest: `release-${Date.now()}`,
              }),
            });
            if (![202, 204].includes(response.status)) {
              console.error("Browser telemetry endpoint failed", { status: response.status });
              process.exit(1);
            }
            console.log("Browser telemetry endpoint verified", { status: response.status });
          })().catch((error) => {
            console.error("Browser telemetry probe failed", error);
            process.exit(1);
          });
          NODE

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run public security smoke and authenticated core flow
        env:
          CI: true
          E2E_BASE_URL: ${{ inputs.deployment_url }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
          E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
          REQUIRE_AUTH_E2E: "true"
          RUN_REAL_AI_E2E: "true"
        run: npx playwright test tests/e2e/smoke.spec.ts tests/e2e/core-flow.spec.ts

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-release-playwright-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14
