name: Core Commercial Release Gate

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deployment_url:
        description: "HTTPS deployment URL to certify"
        required: true
        default: "https://ai-resume-builder-ivory-nine.vercel.app"
        type: string

permissions:
  contents: read
  statuses: write

concurrency:
  group: core-release-${{ github.ref }}
  cancel-in-progress: true

env:
  RELEASE_DEPLOYMENT_URL: ${{ inputs.deployment_url || 'https://ai-resume-builder-ivory-nine.vercel.app' }}
  RELEASE_STATUS_CONTEXT: Core Commercial Release Gate

jobs:
  certify-core:
    name: Health → Security → Authenticated Core Flow
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Mark production certification pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`;
          const target = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const response = await fetch(url, {
            method: "POST",
            headers: {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              "X-GitHub-Api-Version": "2022-11-28",
            },
            body: JSON.stringify({
              state: "pending",
              context: process.env.RELEASE_STATUS_CONTEXT,
              description: "Exact-production certification is running",
              target_url: target,
            }),
          });
          if (!response.ok) throw new Error(`Could not publish pending release status: ${response.status}`);
          NODE

      - name: Validate deployment URL
        env:
          E2E_BASE_URL: ${{ env.RELEASE_DEPLOYMENT_URL }}
        run: |
          node -e 'const u=new URL(process.env.E2E_BASE_URL); if(u.protocol!=="https:") { console.error("deployment_url must use HTTPS"); process.exit(1); }'

      - name: Require authenticated release credentials
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
          E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
        run: |
          node <<'NODE'
          const required = [
            "E2E_EMAIL",
            "E2E_PASSWORD",
            "E2E_USER_B_EMAIL",
            "E2E_USER_B_PASSWORD",
          ];
          const missing = required.filter((key) => !process.env[key] || process.env[key].trim().length === 0);
          if (missing.length > 0) {
            console.error(`Authenticated production certification is blocked. Missing GitHub Actions secrets: ${missing.join(", ")}`);
            process.exit(1);
          }
          if (process.env.E2E_EMAIL === process.env.E2E_USER_B_EMAIL) {
            console.error("Production certification requires two distinct accounts for cross-tenant isolation.");
            process.exit(1);
          }
          console.log("Authenticated release credentials are present for two distinct accounts.");
          NODE

      - name: Install dependencies
        run: npm ci

      - name: Wait for exact production deployment and verify infrastructure readiness
        env:
          E2E_BASE_URL: ${{ env.RELEASE_DEPLOYMENT_URL }}
          EXPECTED_COMMIT_SHA: ${{ github.sha }}
        run: |
          node <<'NODE'
          const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

          (async () => {
            const base = process.env.E2E_BASE_URL.replace(/\/$/, "");
            const expected = process.env.EXPECTED_COMMIT_SHA;
            let lastSeen = null;

            for (let attempt = 1; attempt <= 40; attempt += 1) {
              try {
                const live = await fetch(`${base}/api/health/live`, { redirect: "error", cache: "no-store" });
                const livePayload = await live.json().catch(() => ({}));
                lastSeen = livePayload.commit || null;

                if (live.ok && livePayload.commit === expected) {
                  const response = await fetch(`${base}/api/health`, { redirect: "error", cache: "no-store" });
                  const payload = await response.json().catch(() => ({}));
                  const backend = payload.checks?.observabilityBackend;
                  if (
                    response.ok &&
                    payload.commit === expected &&
                    payload.status === "ready" &&
                    payload.checks?.coreConfiguration === true &&
                    payload.checks?.database === true &&
                    payload.checks?.redis === true &&
                    payload.checks?.observability === true &&
                    ["sentry", "vercel-runtime"].includes(backend)
                  ) {
                    console.log("Core readiness verified", { commit: payload.commit, observabilityBackend: backend });
                    return;
                  }
                }
              } catch (error) {
                console.log("Deployment not ready yet", { attempt, message: error instanceof Error ? error.message : String(error) });
              }

              if (attempt < 40) await sleep(15_000);
            }

            throw new Error(`Exact production deployment did not become ready. expected=${expected} lastSeen=${lastSeen}`);
          })().catch((error) => {
            console.error("Core readiness probe failed", error);
            process.exit(1);
          });
          NODE

      - name: Verify compromised-password rejection
        env:
          E2E_BASE_URL: ${{ env.RELEASE_DEPLOYMENT_URL }}
        run: |
          node <<'NODE'
          (async () => {
            const base = process.env.E2E_BASE_URL.replace(/\/$/, "");
            const response = await fetch(`${base}/api/auth/signup`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                email: `release-probe-${Date.now()}@example.com`,
                password: "password",
              }),
            });
            const payload = await response.json().catch(() => ({}));
            if (response.status !== 400 || payload.error?.code !== "COMPROMISED_PASSWORD") {
              console.error("Compromised-password protection failed", { status: response.status, code: payload.error?.code });
              process.exit(1);
            }
            console.log("Compromised-password protection verified");
          })().catch((error) => {
            console.error("Password-safety probe failed", error);
            process.exit(1);
          });
          NODE

      - name: Verify first-party browser telemetry endpoint
        env:
          E2E_BASE_URL: ${{ env.RELEASE_DEPLOYMENT_URL }}
        run: |
          node <<'NODE'
          (async () => {
            const base = process.env.E2E_BASE_URL.replace(/\/$/, "");
            const response = await fetch(`${base}/api/observability/client-error`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                source: "window-error",
                errorName: "ReleaseProbeError",
                fingerprint: "a".repeat(64),
                route: "/release-probe",
                digest: `release-${Date.now()}`,
              }),
            });
            if (![202, 204].includes(response.status)) {
              console.error("Browser telemetry endpoint failed", { status: response.status });
              process.exit(1);
            }
            console.log("Browser telemetry endpoint verified", { status: response.status });
          })().catch((error) => {
            console.error("Browser telemetry probe failed", error);
            process.exit(1);
          });
          NODE

      - name: Install Chromium
        run: npx playwright install chromium

      - name: Run public security smoke and authenticated core flow
        env:
          CI: true
          E2E_BASE_URL: ${{ env.RELEASE_DEPLOYMENT_URL }}
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
          E2E_USER_B_EMAIL: ${{ secrets.E2E_USER_B_EMAIL }}
          E2E_USER_B_PASSWORD: ${{ secrets.E2E_USER_B_PASSWORD }}
          REQUIRE_AUTH_E2E: "true"
          RUN_REAL_AI_E2E: "true"
        run: npx playwright test tests/e2e/smoke.spec.ts tests/e2e/core-flow.spec.ts

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: core-release-playwright-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Mark production certification failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`;
          const target = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const response = await fetch(url, {
            method: "POST",
            headers: {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              "X-GitHub-Api-Version": "2022-11-28",
            },
            body: JSON.stringify({
              state: "failure",
              context: process.env.RELEASE_STATUS_CONTEXT,
              description: "Exact-production certification failed",
              target_url: target,
            }),
          });
          if (!response.ok) throw new Error(`Could not publish failed release status: ${response.status}`);
          NODE

      - name: Mark production certification successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const url = `https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/statuses/${process.env.GITHUB_SHA}`;
          const target = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          const response = await fetch(url, {
            method: "POST",
            headers: {
              Accept: "application/vnd.github+json",
              Authorization: `Bearer ${process.env.GH_TOKEN}`,
              "X-GitHub-Api-Version": "2022-11-28",
            },
            body: JSON.stringify({
              state: "success",
              context: process.env.RELEASE_STATUS_CONTEXT,
              description: "Exact-production certification passed",
              target_url: target,
            }),
          });
          if (!response.ok) throw new Error(`Could not publish successful release status: ${response.status}`);
          NODE
