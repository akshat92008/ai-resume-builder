name: Paid Release Gate

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: "HTTPS staging deployment to certify for paid release"
        required: true
        type: string
      expected_sha:
        description: "Exact Git SHA deployed to staging"
        required: true
        type: string
      provider_lifecycle_completed:
        description: "Confirm a fresh Razorpay TEST lifecycle completed: checkout/payment/signature/webhook/duplicate+stale handling/scheduled cancellation/final downgrade"
        required: true
        type: boolean
        default: false
      provider_lifecycle_evidence:
        description: "Reference to the fresh Razorpay TEST lifecycle evidence (test subscription/payment IDs or internal run reference; never paste secrets)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  paid-release:
    name: Exact SHA → billing state machine → provider lifecycle → entitlement
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate staging URL and expected SHA
        env:
          E2E_BASE_URL: ${{ inputs.staging_url }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node -e 'const u=new URL(process.env.E2E_BASE_URL); if(u.protocol!=="https:") throw new Error("Paid staging URL must use HTTPS"); if(!/^[0-9a-f]{40}$/i.test(process.env.EXPECTED_SHA||"")) throw new Error("expected_sha must be a full 40-character Git SHA")'

      - name: Install dependencies
        run: npm ci

      - name: Require exact-SHA paid-ready deployment health
        env:
          E2E_BASE_URL: ${{ inputs.staging_url }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: node -e 'fetch(`${process.env.E2E_BASE_URL}/api/health`, {cache:"no-store"}).then(async r=>{const j=await r.json(); if(!r.ok||j.paidReady!==true||j.checks?.billing!=="ready") throw new Error(`Deployment is not paid-ready: ${JSON.stringify(j)}`); if(j.commit!==process.env.EXPECTED_SHA) throw new Error(`Staging SHA mismatch: expected ${process.env.EXPECTED_SHA}, got ${j.commit}`); console.log(`paidReady=true; billing=ready; commit=${j.commit}`)})'

      - name: Verify Razorpay signature boundaries
        run: npx vitest run __tests__/production/razorpay-signatures.test.ts __tests__/production/billing-state.test.ts --reporter=verbose

      - name: Start local Postgres
        run: supabase db start

      - name: Replay billing migrations from zero
        run: supabase db reset --local --no-seed

      - name: Verify Razorpay duplicate, stale, cancellation and downgrade state machine
        run: supabase test db

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

      - name: Require fresh provider lifecycle evidence
        env:
          LIFECYCLE_COMPLETED: ${{ inputs.provider_lifecycle_completed }}
          LIFECYCLE_EVIDENCE: ${{ inputs.provider_lifecycle_evidence }}
        run: |
          node - <<'NODE'
          if (process.env.LIFECYCLE_COMPLETED !== "true") {
            throw new Error("Paid GA requires a fresh Razorpay TEST checkout/payment/webhook/cancellation lifecycle. An already-Pro account is not certification.");
          }
          const evidence = (process.env.LIFECYCLE_EVIDENCE || "").trim();
          if (evidence.length < 8) throw new Error("Provide a non-secret lifecycle evidence reference.");
          if (/secret|password|api[_ -]?key/i.test(evidence)) throw new Error("Do not put credentials or secrets in lifecycle evidence.");
          console.log(`Fresh provider lifecycle evidence accepted: ${evidence}`);
          NODE

      - name: Require paid test credentials
        env:
          E2E_EMAIL: ${{ secrets.PAID_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.PAID_E2E_PASSWORD }}
        run: node -e 'if(!process.env.E2E_EMAIL||!process.env.E2E_PASSWORD) throw new Error("PAID_E2E_EMAIL and PAID_E2E_PASSWORD secrets are required")'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify paid entitlement and refresh persistence
        env:
          CI: true
          E2E_BASE_URL: ${{ inputs.staging_url }}
          E2E_EMAIL: ${{ secrets.PAID_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.PAID_E2E_PASSWORD }}
          REQUIRE_PAID_E2E: "true"
        run: npx playwright test tests/e2e/paid-entitlement.spec.ts
