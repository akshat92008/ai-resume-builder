name: Paid Release Gate

on:
  workflow_dispatch:
    inputs:
      staging_url:
        description: "HTTPS staging deployment to certify for paid release"
        required: true
        type: string

permissions:
  contents: read

jobs:
  paid-release:
    name: Paid staging health → auth → Razorpay entitlement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Validate staging URL
        env:
          E2E_BASE_URL: ${{ inputs.staging_url }}
        run: node -e 'const u=new URL(process.env.E2E_BASE_URL); if(u.protocol!=="https:") throw new Error("Paid staging URL must use HTTPS")'

      - name: Install dependencies
        run: npm ci

      - name: Require paid-ready deployment health
        env:
          E2E_BASE_URL: ${{ inputs.staging_url }}
        run: node -e 'fetch(`${process.env.E2E_BASE_URL}/api/health`, {cache:"no-store"}).then(async r=>{const j=await r.json(); if(!r.ok||j.paidReady!==true||j.checks?.billing!=="ready") throw new Error(`Deployment is not paid-ready: ${JSON.stringify(j)}`); console.log("paidReady=true; billing=ready")})'

      - name: Require paid test credentials
        env:
          E2E_EMAIL: ${{ secrets.PAID_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.PAID_E2E_PASSWORD }}
        run: node -e 'if(!process.env.E2E_EMAIL||!process.env.E2E_PASSWORD) throw new Error("PAID_E2E_EMAIL and PAID_E2E_PASSWORD secrets are required")'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify authenticated persistence and Razorpay paid entitlements
        env:
          CI: true
          E2E_BASE_URL: ${{ inputs.staging_url }}
          E2E_EMAIL: ${{ secrets.PAID_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.PAID_E2E_PASSWORD }}
          REQUIRE_AUTH_E2E: "true"
          REQUIRE_PAID_E2E: "true"
        run: npx playwright test tests/e2e/core-flow.spec.ts tests/e2e/paid-entitlement.spec.ts
